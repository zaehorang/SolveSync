name: Release Chrome preview

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v22.12.0"
          test "$(npm --version)" = "10.9.0"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build release package
        env:
          VITE_GITHUB_APP_CLIENT_ID: ${{ vars.VITE_GITHUB_APP_CLIENT_ID }}
          VITE_GITHUB_APP_SLUG: ${{ vars.VITE_GITHUB_APP_SLUG }}
        run: npm run package:chrome -- "${{ github.ref_name }}"

      - name: Create checksum
        run: |
          cd artifacts
          sha256sum SolveSync-${{ github.ref_name }}.zip > SolveSync-${{ github.ref_name }}.zip.sha256

      - name: Attest release package
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: artifacts/SolveSync-${{ github.ref_name }}.zip

      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/SolveSync-${{ github.ref_name }}.zip \
            artifacts/SolveSync-${{ github.ref_name }}.zip.sha256 \
            --draft \
            --generate-notes \
            --prerelease \
            --title "SolveSync ${{ github.ref_name }}" \
            --verify-tag
