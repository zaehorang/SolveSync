name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v22.12.0"
          test "$(npm --version)" = "10.9.0"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build and package twice
        env:
          VITE_GITHUB_APP_CLIENT_ID: Iv1.ci-public-client-id
          VITE_GITHUB_APP_SLUG: solvesync-ci
        run: |
          npm run package:chrome
          cp artifacts/*.zip "$RUNNER_TEMP/first-build.zip"
          npm run package:chrome
          cmp "$RUNNER_TEMP/first-build.zip" artifacts/*.zip
          sha256sum artifacts/*.zip
