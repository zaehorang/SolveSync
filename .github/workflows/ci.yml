name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 전체 검증
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 checkout
        uses: actions/checkout@v6
        with:
          # ci_gate가 base와의 merge base를 봐야 한다. 얕은 clone에는 그 커밋이 없다.
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # hook은 clone마다 사람이 켜는 opt-in이라 한 번도 돌지 않은 커밋이 올라올 수
      # 있다. 되돌릴 수 없는 둘(secret, 산출물 경로)만 여기서 다시 본다.
      - name: 하네스 CI gate
        env:
          BASE_REF: ${{ github.base_ref }}
          # push 범위 전체의 시작점. 마지막 커밋만 보면 한 번에 올라간 앞 커밋들을 놓친다.
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "$BASE_REF"
            python3 harness/ci_gate.py FETCH_HEAD
          else
            python3 harness/ci_gate.py "$BEFORE_SHA"
          fi

      - name: npm 의존성 설치
        run: npm ci

      - name: 하네스 테스트
        run: python3 -m unittest discover -s harness/tests -t harness

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Extension build
        run: npm run build

  e2e:
    name: 검증 하네스
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 안정화될 때까지 머지를 막지 않는다. 확장 로드와 service worker 기동은
    # 단위 테스트보다 환경에 민감하다.
    continue-on-error: true

    steps:
      - name: 저장소 checkout
        uses: actions/checkout@v6

      - name: Node.js 설정
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: npm 의존성 설치
        run: npm ci

      # headless 기본 바이너리(chromium_headless_shell)는 확장을 지원하지
      # 않는다. 정식 Chromium 채널을 받아야 MV3 확장이 뜬다.
      - name: Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: Extension build
        run: npm run build

      # secret이 없으면 GitHub write 계층은 스스로 건너뛴다. fork PR에는
      # secret이 주입되지 않으므로 Sealed 계층만 남고 그대로 통과한다.
      - name: 하네스 검증
        env:
          E2E_GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
          E2E_GITHUB_REPOSITORY: ${{ vars.E2E_GITHUB_REPOSITORY }}
        run: npm run e2e
