name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 전체 검증
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 checkout
        uses: actions/checkout@v6

      - name: Node.js 설정
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: npm 의존성 설치
        run: npm ci

      - name: 하네스 테스트
        run: python3 -m unittest discover -s harness/tests -t harness

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Extension build
        run: npm run build
