# SolveSync agent harness — codex hook registration.
#
# Read from the main repository root. Worktrees inherit this file and the
# repository's trust, so no per-worktree setup is needed. The command is a
# relative path on purpose: it resolves against the worktree's own root, so each
# worktree runs the hook checked out on its branch.
#
# The hook denies tool calls that would leave the worktree, push, open a pull
# request, bypass the commit gate, or write logic code that has no test.

[[hooks.PreToolUse]]
matcher = "*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "harness/hooks/pretooluse.py"
